name: Set up just
description: Install the pinned just release without querying the GitHub Releases API

runs:
  using: composite
  steps:
    - name: Download and verify just
      shell: bash
      env:
        JUST_VERSION: "1.58.0"
        JUST_SHA256: "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d"
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" != "Linux" || "$RUNNER_ARCH" != "X64" ]]; then
          echo "Unsupported runner for the pinned just binary: $RUNNER_OS/$RUNNER_ARCH" >&2
          exit 1
        fi

        archive="$RUNNER_TEMP/just-$JUST_VERSION.tar.gz"
        install_dir="$RUNNER_TEMP/just-$JUST_VERSION"
        curl --fail --location --silent --show-error --retry 3 \
          --output "$archive" \
          "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
        echo "$JUST_SHA256  $archive" | sha256sum --check -
        mkdir -p "$install_dir"
        tar -xzf "$archive" -C "$install_dir" just
        chmod 0755 "$install_dir/just"
        echo "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/just" --version
