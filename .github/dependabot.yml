version: 2

# workflow 里的 action 全部按 commit SHA 固定（见 .github/workflows/*.yml），
# 这让可变 tag 无法成为通向发布环境的写入路径，代价是需要有东西推着升级。
# Dependabot 会带着行尾注释里的版本号一起更新 SHA。
#
# 刻意不配置 npm/packages/cli：那个 wrapper 没有任何 dependencies 或
# devDependencies，配上只会产生空扫描噪声。
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  # pyproject 把 ty 与 pyinstaller 固定到确切版本，理由写的是「升级走 Dependabot/人工」，
  # 但仓库此前并没有 uv 入口，那句话没有兑现的机制。
  # uv 生态会连同 uv.lock 一起更新，AD-174 的 --locked 门禁因此校验的是真实解析结果。
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # patch/minor 合成一个 PR：逐个评审这类更新只是把同一份 CI 结果看很多遍。
      # major 不属于任何分组，会各自单独开 PR——它们要读 changelog，不该混在例行升级里。
      python-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
      python-dev:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      prefix-development: chore

  # PEP 517 dependencies live outside uv.lock. Dependabot's pip-compile support
  # updates the exact input pin together with the generated hashes.
  - package-ecosystem: pip
    directory: /packaging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-build:
        patterns:
          - "*"
    commit-message:
      prefix: chore

  # Web 更新 PR 会经过 AD-173 的 frozen install + check + build 门禁
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # `astro check` 经由 @astrojs/language-server 调用 TypeScript 的 JS 编程 API，
    # 而 TS 7 起的原生编译器不再导出这套 API（@astrojs/check 的 peer 范围也只写到
    # ^6.0.0）。pnpm 对 peer 不匹配只告警不失败，于是这类升级不会在 install 阶段
    # 被拦下，而是拖到 check 阶段崩掉——挡在这里比每次读一遍同样的 CI 日志便宜。
    # 上游支持原生编译器后（withastro/roadmap#1321）删掉这条。
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7"
    groups:
      web-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
      web-dev:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      prefix-development: chore
