name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Project 依赖来自 uv.lock；PEP 517 依赖在 build step 由已提交的 hash constraints 约束。
  UV_LOCKED: "1"

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      native-matrix: ${{ steps.native-targets.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install just
        uses: ./.github/actions/setup-just

      - name: Install Python dependencies
        run: uv sync --locked --dev --python ${{ env.PYTHON_VERSION }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve native target matrix
        id: native-targets
        shell: bash
        run: echo "matrix=$(node npm/scripts/native-targets.mjs)" >> "${GITHUB_OUTPUT}"

      - name: Validate tag version
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"

          if [[ ! "${TAG_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid tag format: ${TAG_NAME}"
            exit 1
          fi

          TAG_VERSION="${BASH_REMATCH[1]}"
          PACKAGE_VERSION="$(uv run python -c 'from agent_dump.__about__ import __version__; print(__version__)')"

          if [ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "Tag version ${TAG_VERSION} does not match package version ${PACKAGE_VERSION}"
            exit 1
          fi

          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "${GITHUB_ENV}"

      - name: Sync npm versions
        run: node npm/scripts/sync-version.mjs

      - name: Lint
        run: just lint

      - name: Check
        run: just check

      - name: Test
        run: just test

      - name: Test npm wrapper
        run: npm --prefix npm test

  build-native:
    name: Build Native ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.native-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: uv sync --locked --dev --python ${{ env.PYTHON_VERSION }}

      - name: Build native binary
        env:
          PYINSTALLER_CONFIG_DIR: .pyinstaller
        run: >
          uv run --locked --group packaging pyinstaller packaging/pyinstaller.spec
          --clean
          --noconfirm
          --distpath dist/native/${{ matrix.target }}
          --workpath build/pyinstaller/${{ matrix.target }}

      - name: Run an isolated session workflow with the built binary
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/native/${{ matrix.target }}/${{ matrix.binary_name }}"
          chmod +x "${binary}" || true
          uv run python packaging/verify_native.py \
            --binary "${binary}" \
            --expected-version "${GITHUB_REF_NAME#v}"

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/native/${{ matrix.target }}/${{ matrix.binary_name }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build-native
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: uv sync --locked --dev --python ${{ env.PYTHON_VERSION }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@agent-dump"

      - name: Resolve release version
        shell: bash
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"

      - name: Download native binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: false

      - name: Sync npm versions
        run: node npm/scripts/sync-version.mjs

      - name: Stage npm binaries
        run: node npm/scripts/stage-binaries.mjs --artifacts dist/native

      - name: Restore previously published npm binaries
        run: node npm/scripts/restore-published-binaries.mjs

      - name: Validate staged npm binaries
        run: node npm/scripts/validate-staged-binaries.mjs

      - name: Write npm binary checksums
        run: node npm/scripts/write-checksums.mjs

      - name: Build PyPI distributions
        run: uv build --no-sources --build-constraint packaging/build-constraints.txt --require-hashes

      - name: Verify the wheel installs and runs
        run: uv run python packaging/verify_wheel.py --expected-version "${PACKAGE_VERSION}"

      - name: Pack and verify every npm package
        run: npm --prefix npm run smoke -- --all-platforms --keep-pack

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ""
        run: node npm/scripts/publish-if-needed.mjs --release-dir ./npm/.pack

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/

      - name: Stage GitHub release assets
        run: node npm/scripts/stage-release-assets.mjs dist/release

      - name: Verify existing GitHub release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python packaging/verify_release_assets.py \
            dist/release/* \
            dist/agent_dump-${PACKAGE_VERSION}.tar.gz \
            dist/agent_dump-${PACKAGE_VERSION}-py3-none-any.whl

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            dist/release/*
            dist/agent_dump-${{ env.PACKAGE_VERSION }}.tar.gz
            dist/agent_dump-${{ env.PACKAGE_VERSION }}-py3-none-any.whl

  smoke-npm:
    name: Smoke npx ${{ matrix.target }}
    needs: [validate, publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.native-matrix) }}

    steps:
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Smoke test npx package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if npx @agent-dump/cli@"${VERSION}" --help; then
              exit 0
            fi
            sleep 15
          done
          exit 1

  smoke-bun:
    name: Smoke bunx
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Smoke test bunx package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if bunx @agent-dump/cli@"${VERSION}" --help; then
              exit 0
            fi
            sleep 15
          done
          exit 1
