name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  # Project 依赖来自 uv.lock；PEP 517 依赖在 build step 由已提交的 hash constraints 约束。
  UV_LOCKED: "1"

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install Python dependencies
        run: uv sync --locked --dev --python ${{ env.PYTHON_VERSION }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate tag version
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"

          if [[ ! "${TAG_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid tag format: ${TAG_NAME}"
            exit 1
          fi

          TAG_VERSION="${BASH_REMATCH[1]}"
          PACKAGE_VERSION="$(uv run python -c 'from agent_dump.__about__ import __version__; print(__version__)')"

          if [ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "Tag version ${TAG_VERSION} does not match package version ${PACKAGE_VERSION}"
            exit 1
          fi

          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "${GITHUB_ENV}"

      - name: Sync npm versions
        run: node npm/scripts/sync-version.mjs

      - name: Lint
        run: just lint

      - name: Check
        run: just check

      - name: Test
        run: just test

      - name: Test npm wrapper
        run: npm --prefix npm test

  build-native:
    name: Build Native ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary_name: agent-dump
          - os: windows-latest
            target: win32-x64
            binary_name: agent-dump.exe
          - os: macos-15-intel
            target: darwin-x64
            binary_name: agent-dump
          - os: macos-14
            target: darwin-arm64
            binary_name: agent-dump

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: uv sync --locked --dev --python ${{ env.PYTHON_VERSION }}

      - name: Build native binary
        env:
          PYINSTALLER_CONFIG_DIR: .pyinstaller
        run: >
          uv run --locked --group packaging pyinstaller packaging/pyinstaller.spec
          --clean
          --noconfirm
          --distpath dist/native/${{ matrix.target }}
          --workpath build/pyinstaller/${{ matrix.target }}

      - name: Run the built binary on its target runner
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/native/${{ matrix.target }}/${{ matrix.binary_name }}"
          chmod +x "${binary}" || true
          "${binary}" --version
          "${binary}" --help > /dev/null

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/native/${{ matrix.target }}/${{ matrix.binary_name }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build-native
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: uv sync --locked --dev --python ${{ env.PYTHON_VERSION }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@agent-dump"

      - name: Resolve release version
        shell: bash
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"

      - name: Download linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-linux-x64
          path: dist/native/linux-x64

      - name: Download windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-win32-x64
          path: dist/native/win32-x64

      - name: Download darwin x64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-darwin-x64
          path: dist/native/darwin-x64

      - name: Download darwin arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-darwin-arm64
          path: dist/native/darwin-arm64

      - name: Make Unix binaries executable
        run: chmod +x dist/native/linux-x64/agent-dump dist/native/darwin-x64/agent-dump dist/native/darwin-arm64/agent-dump

      - name: Sync npm versions
        run: node npm/scripts/sync-version.mjs

      - name: Stage npm binaries
        run: |
          node npm/scripts/stage-binaries.mjs linux-x64 dist/native/linux-x64/agent-dump
          node npm/scripts/stage-binaries.mjs win32-x64 dist/native/win32-x64/agent-dump.exe
          node npm/scripts/stage-binaries.mjs darwin-x64 dist/native/darwin-x64/agent-dump
          node npm/scripts/stage-binaries.mjs darwin-arm64 dist/native/darwin-arm64/agent-dump

      - name: Validate staged npm binaries
        run: node npm/scripts/validate-staged-binaries.mjs

      - name: Write npm binary checksums
        run: node npm/scripts/write-checksums.mjs

      - name: Build PyPI distributions
        run: uv build --no-sources --build-constraint packaging/build-constraints.txt --require-hashes

      - name: Verify the wheel installs and runs
        run: uv run python packaging/verify_wheel.py --expected-version "${PACKAGE_VERSION}"

      - name: Verify the packed npm tarballs install and run
        run: npm --prefix npm run smoke

      - name: Publish npm platform packages
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          npm publish ./npm/packages/cli-linux-x64 --provenance --access public
          npm publish ./npm/packages/cli-win32-x64 --provenance --access public
          npm publish ./npm/packages/cli-darwin-x64 --provenance --access public
          npm publish ./npm/packages/cli-darwin-arm64 --provenance --access public

      - name: Publish npm CLI package
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish ./npm/packages/cli --provenance --access public

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish

      - name: Stage GitHub release assets
        shell: bash
        run: |
          mkdir -p dist/release
          cp dist/native/linux-x64/agent-dump dist/release/agent-dump-linux-x64
          cp dist/native/win32-x64/agent-dump.exe dist/release/agent-dump-win32-x64.exe
          cp dist/native/darwin-x64/agent-dump dist/release/agent-dump-darwin-x64
          cp dist/native/darwin-arm64/agent-dump dist/release/agent-dump-darwin-arm64
          cp npm/packages/cli/lib/binary-checksums.json dist/release/agent-dump-binary-checksums.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/release/agent-dump-linux-x64
            dist/release/agent-dump-win32-x64.exe
            dist/release/agent-dump-darwin-x64
            dist/release/agent-dump-darwin-arm64
            dist/release/agent-dump-binary-checksums.json
            dist/agent_dump-${{ env.PACKAGE_VERSION }}.tar.gz
            dist/agent_dump-${{ env.PACKAGE_VERSION }}-py3-none-any.whl

  smoke-npm:
    name: Smoke npx ${{ matrix.os }}
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-14

    steps:
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Smoke test npx package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if npx @agent-dump/cli@"${VERSION}" --help; then
              exit 0
            fi
            sleep 15
          done
          exit 1

  smoke-bun:
    name: Smoke bunx
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Smoke test bunx package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if bunx @agent-dump/cli@"${VERSION}" --help; then
              exit 0
            fi
            sleep 15
          done
          exit 1
