name: Build Rust artifacts

on:
  workflow_call:

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  PYTHONUTF8: "1"

jobs:
  targets:
    name: Resolve release targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Intel macOS runner 排队和构建都最慢，是 PR CI 的瓶颈；
      # darwin-x64 只在 main 和 release 上验证
      - id: targets
        run: |
          matrix=$(node npm/scripts/native-targets.mjs)
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            matrix=$(jq -c '.include |= map(select(.target != "darwin-x64"))' <<< "${matrix}")
          fi
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: Install artifacts (${{ matrix.target }})
    needs: targets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 安装验证会反复创建 venv 和临时目录；默认 TEMP 在远程托管的 C: 盘，
      # 曾让 uv venv 超时，改用 runner 本地的 D: 盘
      - name: Keep temporary files on the Windows work disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "tmp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - uses: ./.github/actions/setup-uv
      - name: Install Python
        run: uv python install 3.10 3.12 3.14
      - name: Install build tools
        run: uv sync --locked --dev --group packaging --python 3.12
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: packaging-v2-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build wheel from sdist and stage identical npm binary
        run: uv run --group packaging python packaging/build_release.py
      - name: Verify pip, uv tool and uvx on Python 3.10
        run: uv run python packaging/verify_wheel.py --python 3.10
      - name: Verify pip, uv tool and uvx on Python 3.14
        run: uv run python packaging/verify_wheel.py --python 3.14
      - name: Verify native executable
        run: uv run python packaging/verify_native.py --binary dist/native/${{ matrix.target }}/${{ matrix.binary_name }}
      - name: Stage npm executable
        run: node npm/scripts/stage-binaries.mjs ${{ matrix.target }} dist/native/${{ matrix.target }}/${{ matrix.binary_name }}
      - name: Verify npm, npx and bunx installation
        run: npm --prefix npm run smoke -- --keep-pack
      - name: Verify glibc 2.17 runtime
        if: runner.os == 'Linux'
        run: >-
          docker run --rm -v "$PWD:/work:ro" -w /tmp
          quay.io/pypa/manylinux2014_x86_64@sha256:2fa5f99f660f115f547d96b4edcadfc19f77a6de8807734bf0fc4924f81be01a
          /opt/python/cp310-cp310/bin/python /work/packaging/verify_native.py
          --binary /work/dist/native/${{ matrix.target }}/${{ matrix.binary_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: dist/native/${{ matrix.target }}/${{ matrix.binary_name }}
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-report-${{ matrix.target }}
          path: dist/artifact-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
