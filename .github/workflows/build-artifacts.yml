name: Build Rust artifacts

on:
  workflow_call:
    inputs:
      matrix:
        description: Native target matrix from npm/scripts/native-targets.mjs
        required: true
        type: string

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  PYTHONUTF8: "1"

jobs:
  build:
    name: Install artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      # 契约直接验证待发布的二进制，不再为测试单独构建一份 release
      AGENT_DUMP_TEST_BINARY: dist/native/${{ matrix.target }}/${{ matrix.binary_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/use-windows-work-disk
      - uses: ./.github/actions/setup-uv
      - name: Install Python
        run: uv python install 3.10 3.12 3.14
      - name: Install build tools
        run: uv sync --locked --dev --group packaging --python 3.12
      - name: Install pinned Rust toolchain
        run: rustup install
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: packaging-v3-${{ matrix.target }}
          save-if: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build wheel from sdist and stage identical npm binary
        run: uv run --group packaging python packaging/build_release.py
      # Intel macOS 与 darwin-arm64 是同一份测试，不值得再占一台最慢的 runner
      - name: Verify build and evaluation tooling
        if: matrix.target != 'darwin-x64'
        run: uv run pytest -q tests/tooling
      - name: Test Rust CLI contracts
        if: matrix.target != 'darwin-x64'
        run: uv run pytest -q -n auto tests/cli --durations=30 --junitxml=dist/ci/contracts.xml
      - name: Upload CLI test timings
        if: ${{ !cancelled() && matrix.target != 'darwin-x64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts-${{ matrix.target }}
          path: dist/ci/contracts.xml
          retention-days: 14
          if-no-files-found: ignore
      - name: Test shell installer on macOS
        if: matrix.target == 'darwin-arm64'
        run: node --test npm/tests/shell-install.test.mjs npm/tests/distribution.test.mjs
      - name: Verify pip, uv tool and uvx on Python 3.10
        run: uv run python packaging/verify_wheel.py --python 3.10
      - name: Verify pip, uv tool and uvx on Python 3.14
        run: uv run python packaging/verify_wheel.py --python 3.14
      - name: Verify native executable
        run: uv run python packaging/verify_native.py --binary dist/native/${{ matrix.target }}/${{ matrix.binary_name }}
      - name: Stage npm executable
        run: node npm/scripts/stage-binaries.mjs ${{ matrix.target }} dist/native/${{ matrix.target }}/${{ matrix.binary_name }}
      - name: Verify npm, npx and bunx installation
        run: npm --prefix npm run smoke -- --keep-pack
      - name: Verify glibc 2.17 runtime
        if: runner.os == 'Linux'
        run: >-
          docker run --rm -v "$PWD:/work:ro" -w /tmp
          quay.io/pypa/manylinux2014_x86_64@sha256:2fa5f99f660f115f547d96b4edcadfc19f77a6de8807734bf0fc4924f81be01a
          /opt/python/cp310-cp310/bin/python /work/packaging/verify_native.py
          --binary /work/dist/native/${{ matrix.target }}/${{ matrix.binary_name }}
      # 只有 release 的 publish job 下载这些制品，PR 和 main 上传了也没人用
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: native-${{ matrix.target }}
          path: dist/native/${{ matrix.target }}/${{ matrix.binary_name }}
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: artifact-report-${{ matrix.target }}
          path: dist/artifact-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux' && github.ref_type == 'tag'
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
