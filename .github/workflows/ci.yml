name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# uv sync 默认会在同步前重新锁定，uv run 也一样。验证过程绝不能修改 uv.lock：
# 临时 checkout 里的静默重锁不会出现在 PR diff 中，评审看到的解析结果与实际
# 安装的就对不上了。
env:
  UV_LOCKED: "1"
  # lint/typecheck 与运行时 Python 无关，固定一个版本即可
  QUALITY_PYTHON_VERSION: "3.12"

jobs:
  artifacts:
    uses: ./.github/workflows/build-artifacts.yml

  uv-windows:
    name: Verify pinned uv installer on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: ./.github/actions/setup-uv

  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Set up Python ${{ env.QUALITY_PYTHON_VERSION }}
        run: uv python install ${{ env.QUALITY_PYTHON_VERSION }}

      - name: Install just
        uses: ./.github/actions/setup-just

      - name: Install dependencies
        run: uv sync --locked --dev --python ${{ env.QUALITY_PYTHON_VERSION }}

      - name: Lint
        run: just lint-tools

      - name: Check
        run: just check-tools

  rust:
    name: Rust CLI parity (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Set up Python
        run: uv python install ${{ env.QUALITY_PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --dev --python ${{ env.QUALITY_PYTHON_VERSION }}

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check Rust formatting
        if: matrix.shard == 0
        run: cargo fmt --all --check

      - name: Check Rust types
        if: matrix.shard == 0
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust
        if: matrix.shard == 0
        run: cargo test --locked --workspace

      - name: Build Rust
        run: cargo build --locked --release

      - name: Install frozen Python reference
        run: uv run python scripts/python_reference.py --install

      - name: Verify build and evaluation tooling
        if: matrix.shard == 0
        run: uv run pytest -q tests/tooling

      - name: Compare Rust and Python CLI behavior
        run: >-
          uv run --locked python -c
          "import pathlib, subprocess, sys; files = sorted(pathlib.Path('tests/cli').glob('test_*.py'));
          sys.exit(subprocess.call([sys.executable, '-m', 'pytest', '-q', '--maxfail=10', *map(str, files[int(sys.argv[1])::4])]))"
          ${{ matrix.shard }}

  web:
    name: Check landing page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版本从 web/package.json 的 packageManager 读取：pnpm 版本只有一处事实，
      # 不在 workflow 里再硬编码一遍
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      # frozen-lockfile：CI 的事实必须来自已提交的 lock，而不是解析出的新版本
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Type-check web
        run: pnpm --dir web check

      - name: Build web
        run: pnpm --dir web build

      - name: Install Chromium
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          for attempt in 1 2 3; do
            echo "Installing Chromium (attempt ${attempt}/3)"
            if timeout --kill-after=10s 3m pnpm --dir web exec playwright install --with-deps chromium; then
              exit 0
            fi
          done
          exit 1

      - name: Test web interactions
        run: pnpm --dir web test:e2e

  npm-wrapper:
    name: Test npm wrapper on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 最低支持线与发布 runtime 都要真的被跑到；夹在中间的版本由这两端覆盖
        node-version: ["22", "24"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test npm wrapper
        run: npm --prefix npm test
