name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# uv sync 默认会在同步前重新锁定，uv run 也一样。验证过程绝不能修改 uv.lock：
# 临时 checkout 里的静默重锁不会出现在 PR diff 中，评审看到的解析结果与实际
# 安装的就对不上了。
env:
  UV_LOCKED: "1"
  # lint/typecheck 与运行时 Python 无关，固定一个版本即可
  QUALITY_PYTHON_VERSION: "3.12"
  # 唯一测量并门禁覆盖率的 leg
  COVERAGE_PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # ruff 与 pyright 的结论都不随运行时 Python 变化——pyright 的分析版本由
      # pyproject 固定，ruff 读的是 target-version。跑五遍只是重复付钱。
      - name: Set up Python ${{ env.QUALITY_PYTHON_VERSION }}
        run: uv python install ${{ env.QUALITY_PYTHON_VERSION }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install dependencies
        run: uv sync --locked --dev --python ${{ env.QUALITY_PYTHON_VERSION }}

      - name: Lint
        run: just lint

      - name: Check
        run: just check

      - name: Build distributions
        run: just build

      - name: Verify wheel
        run: just verify-wheel

  python-tests:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install dependencies
        run: uv sync --locked --dev --python ${{ matrix.python-version }}

      # coverage leg 跑的就是完整测试集，再跑一次 just test 是同一批用例跑两遍
      - name: Test
        if: matrix.python-version != env.COVERAGE_PYTHON_VERSION
        run: just test

      - name: Test with coverage
        if: matrix.python-version == env.COVERAGE_PYTHON_VERSION
        run: just cov

  web:
    name: Check landing page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版本从 web/package.json 的 packageManager 读取：pnpm 版本只有一处事实，
      # 不在 workflow 里再硬编码一遍
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      # frozen-lockfile：CI 的事实必须来自已提交的 lock，而不是解析出的新版本
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Type-check web
        run: pnpm --dir web check

      - name: Build web
        run: pnpm --dir web build

  npm-wrapper:
    name: Test npm wrapper on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 最低支持线与发布 runtime 都要真的被跑到；夹在中间的版本由这两端覆盖
        node-version: ["22", "24"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test npm wrapper
        run: npm --prefix npm test
