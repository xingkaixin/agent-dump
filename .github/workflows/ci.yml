name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# PR 只保留最新一次推送。main 的 group 带 SHA：同一 group 只留一个等待中的运行，
# 否则连续合并时中间的提交会被顶掉，没有完整跑过
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# uv sync 默认会在同步前重新锁定，uv run 也一样。验证过程绝不能修改 uv.lock：
# 临时 checkout 里的静默重锁不会出现在 PR diff 中，评审看到的解析结果与实际
# 安装的就对不上了。
env:
  UV_LOCKED: "1"
  # lint/typecheck 与运行时 Python 无关，固定一个版本即可
  QUALITY_PYTHON_VERSION: "3.12"

jobs:
  # PR 按改动范围跳过 job；main 不过滤，保证每个提交都完整跑过。
  # 过滤放在 job 级而不是 on.paths：工作流级跳过不产生任何 check，必需检查会一直挂起
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.areas.outputs.code }}
      web: ${{ steps.areas.outputs.web }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 改名要带上 previous_filename，否则把代码移进 docs/ 会被当成纯文档改动
      - id: areas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | .filename, .previous_filename // empty' \
              | bash .github/scripts/changed-areas.sh >> "${GITHUB_OUTPUT}"
          else
            echo "code=true" >> "${GITHUB_OUTPUT}"
            echo "web=true" >> "${GITHUB_OUTPUT}"
          fi

      # Intel macOS runner 排队和构建都最慢，是 PR CI 的瓶颈；
      # darwin-x64 只在 main 和 release 上验证
      - id: targets
        run: |
          matrix=$(node npm/scripts/native-targets.mjs)
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            matrix=$(jq -c '.include |= map(select(.target != "darwin-x64"))' <<< "${matrix}")
          fi
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  artifacts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build-artifacts.yml
    with:
      matrix: ${{ needs.changes.outputs.matrix }}

  quality:
    name: Lint and type-check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Set up Python ${{ env.QUALITY_PYTHON_VERSION }}
        run: uv python install ${{ env.QUALITY_PYTHON_VERSION }}

      - name: Install just
        uses: ./.github/actions/setup-just

      - name: Install dependencies
        run: uv sync --locked --dev --python ${{ env.QUALITY_PYTHON_VERSION }}

      - name: Lint
        run: just lint-tools

      - name: Check
        run: just check-tools

  # release 二进制只在 artifacts 里构建一次，CLI 契约和工具验证也在那里跑
  rust:
    name: Rust checks (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    env:
      # CI 不调试：不生成调试信息，链接更快，缓存也更小
      CARGO_PROFILE_DEV_DEBUG: "0"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/use-windows-work-disk

      - name: Install pinned Rust toolchain
        run: rustup install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks-${{ runner.os }}-${{ runner.arch }}
          save-if: true

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Windows 有大量 cfg(windows) 代码，需要单独 lint。macOS 独有的只有 private_files.rs
      # 的一行 fsync，它由下面的 cargo test 编译，不值得再占一遍 macOS runner
      - name: Check Rust lints
        if: runner.os != 'macOS'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked --workspace

  web:
    name: Check landing page
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版本从 web/package.json 的 packageManager 读取：pnpm 版本只有一处事实，
      # 不在 workflow 里再硬编码一遍
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      # frozen-lockfile：CI 的事实必须来自已提交的 lock，而不是解析出的新版本
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Type-check web
        run: pnpm --dir web check

      - name: Build web
        run: pnpm --dir web build

      - name: Install Chromium
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          for attempt in 1 2 3; do
            echo "Installing Chromium (attempt ${attempt}/3)"
            if timeout --kill-after=10s 3m pnpm --dir web exec playwright install --only-shell chromium; then
              exit 0
            fi
          done
          exit 1

      - name: Test web interactions
        run: pnpm --dir web test:e2e --repeat-each=3

  npm-wrapper:
    name: Test npm wrapper on Node ${{ matrix.node-version }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 最低支持线与发布 runtime 都要真的被跑到；夹在中间的版本由这两端覆盖
        node-version: ["22", "24"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test npm wrapper
        run: npm --prefix npm test

  # 分支保护只需要要求这一个 check：被跳过的 job 算通过，失败或取消的 job 会让它失败
  ci-ok:
    name: CI OK
    needs: [changes, artifacts, quality, rust, web, npm-wrapper]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
