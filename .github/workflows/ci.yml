name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# uv sync 默认会在同步前重新锁定，uv run 也一样。验证过程绝不能修改 uv.lock：
# 临时 checkout 里的静默重锁不会出现在 PR diff 中，评审看到的解析结果与实际
# 安装的就对不上了。
env:
  UV_LOCKED: "1"

jobs:
  build:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install dependencies
        run: uv sync --locked --dev --python ${{ matrix.python-version }}

      - name: Lint
        run: just lint

      - name: Check
        run: just check

      - name: Test
        run: just test

      # 覆盖率只在一条 leg 上测量并门禁：五个版本各跑一遍只是重复付钱
      - name: Coverage
        if: matrix.python-version == '3.12'
        run: just cov

  web:
    name: Check landing page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版本从 web/package.json 的 packageManager 读取：pnpm 版本只有一处事实，
      # 不在 workflow 里再硬编码一遍
      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: web/package.json

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      # frozen-lockfile：CI 的事实必须来自已提交的 lock，而不是解析出的新版本
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Type-check web
        run: pnpm --dir web check

      - name: Build web
        run: pnpm --dir web build

  npm-wrapper:
    name: Test npm wrapper on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 最低支持线与发布 runtime 都要真的被跑到；夹在中间的版本由这两端覆盖
        node-version: ["22", "24"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test npm wrapper
        run: npm --prefix npm test
