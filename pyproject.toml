[project]
name = "agent-dump"
dynamic = ["version"]
description = "AI Coding Assistant Session Export Tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "XingKaiXin", email = "xingkaixin@gmail.com" },
]
keywords = ["ai", "chat", "export", "opencode", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xingkaixin/agent-dump"
Repository = "https://github.com/xingkaixin/agent-dump"
Issues = "https://github.com/xingkaixin/agent-dump/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.2",
    "tomli>=2.0.0",
    "ty==0.0.83",
]
packaging = [
    "maturin==1.15.0",
    "ziglang==0.16.0; sys_platform == 'linux'",
]

[build-system]
requires = ["maturin>=1.15,<1.16"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "Cargo.toml"
bindings = "bin"
locked = true
strip = true
include = [{ path = "rust-toolchain.toml", format = "sdist" }]

[tool.uv]
# Python is used only for CLI verification and wheel build tooling.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests/cli"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ty.src]
exclude = [".venv-reference"]

[tool.ty.environment]
extra-paths = ["scripts", "tests/cli"]
